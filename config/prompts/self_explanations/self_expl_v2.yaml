# The question templates are the same for all models but change depending on how a dataset is used.
# - llava and mmbench: open-ended QA
# - seed and vqav2: multiple-choice QA
question_template:
  # No template here, directly ask the question over the image
  llava: ""
  # MMBench contains multiple-choice questions, in this work we apply them in a generation setting
  mmbench: "Provide a concise and descriptive caption for this image."
  # Steer the model to provide only the letter of the option corresponding to the answer
  seed: "Based on the provided image, analyze the given question and choose the most accurate option from the listed alternatives. Your response must consist solely of the answer you believe is correct, without any additional explanation."
  # The GT answers from this dataset are made of 1 word only. Instruct the model to answer in that way.
  vqav2: "Based on the given image, answer the question using only one word. Provide no additional text or explanation."

# The rationale templates are the result of prompt engineering done for each model such that
# the given instructions are followed.
rationale_template:
  internvl2: |
    "Review the given answer and carefully analyze the image. Identify and describe the key visual elements and concepts in the image that directly support your reasoning and answer. For each point, clearly explain how that visual element contributes to the answer, and ensure every point is directly linked to the reasoning behind the answer."
    "Present your rationale in a structured, bullet-point format with the following guidelines:"
    "- Each bullet point must begin with the * character."
    "- Each point should clearly explain the connection between a specific visual element and the given answer."
    "- Avoid general descriptions of the image; focus on visual details that are relevant to the answer."
    "- Keep each point concise and ensure it directly addresses the reasoning behind the answer."
  llava-next: |
    "Review the given answer and carefully analyze the image. Identify and describe the key visual elements and concepts in the image that directly support your reasoning and answer. For each point, clearly explain how that visual element contributes to the answer, and ensure every point is directly linked to the reasoning behind the answer."
