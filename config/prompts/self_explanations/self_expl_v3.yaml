# The question templates change depending on how a dataset is used.
# - llava and mmbench: open-ended QA
# - seed and vqav2: multiple-choice QA
# Prompt engineering was conducted to ensure consitent answers across models.
question_template:
  internvl2:
    # No template here, directly ask the question over the image
    llava: ""
    # MMBench contains multiple-choice questions, in this work we apply them in a generation setting
    mmbench: "Provide a concise and descriptive caption for this image."
    # Steer the model to provide only the letter of the option corresponding to the answer
    seed: "Based on the provided image, analyze the given question and choose the most accurate option from the listed alternatives. Your response should consist solely of the letter corresponding to the correct answer (A, B, C, or D), without any additional explanation."
    # The GT answers from this dataset are made of 1 word only. Instruct the model to answer in that way.
    vqav2: "Based on the given image, answer the question using only one word. Provide no additional text or explanation."
  llava-next: 
    llava: ""
    mmbench: "Provide a concise and descriptive caption for this image."
    seed: "Based on the provided image, analyze the given question and choose the most accurate option from the listed alternatives. Your response should consist solely of the letter corresponding to the correct answer (A, B, C, or D), without any additional explanation."
    vqav2: "Based on the given image, answer the question using only one word. Provide no additional text or explanation."
  sharegpt4v: 
    llava: ""
    mmbench: "Provide a concise and descriptive caption for this image."
    seed: "Based on the provided image, analyze the given question and choose the most accurate option from the listed alternatives. Your response must consist solely of the answer you believe is correct, without any additional explanation."
    vqav2: "Based on the given image, answer the question using only one word. Provide no additional text or explanation."
  minigpt4: 
    llava: ""
    mmbench: "Provide a concise and descriptive caption for this image."
    seed: "Based on the provided image and question, choose the most accurate answer from the listed alternatives: A, B, C, or D. Only provide the answer, no explanation whatsoever."
    vqav2: "Based on the given image, answer the question using only one word. Provide no additional text or explanation."

# The rationale templates are the result of prompt engineering done for each model such that
# the given instructions are followed.
rationale_template:
  internvl2: |
    "Review the given answer and carefully analyze the image. Identify and describe the key visual elements and concepts in the image that directly support your reasoning and answer. For each point, clearly explain how that visual element contributes to the answer, and ensure every point is directly linked to the reasoning behind the answer."
    "Present your rationale in a structured, bullet-point format with the following guidelines:"
    "- Each bullet point must begin with the * character."
    "- Each point should clearly explain the connection between a specific visual element and the given answer."
    "- Avoid general descriptions of the image; focus on visual details that are relevant to the answer."
    "- Keep each point concise and ensure it directly addresses the reasoning behind the answer."
  llava-next: |
    "Review the given answer and carefully analyze the image. Identify and describe the key visual elements and concepts in the image that directly support your reasoning and answer. For each point, clearly explain how that visual element contributes to the answer, and ensure every point is directly linked to the reasoning behind the answer."
    "Present your rationale in a structured, bullet-point format with the following guidelines:"
    "- Each bullet point must begin with the * character."
    "- Each point should clearly explain the connection between a specific visual element and the given answer."
    "- Avoid general descriptions of the image; focus on visual details that are relevant to the answer."
    "- Keep each point concise and ensure it directly addresses the reasoning behind the answer."
  sharegpt4v: |
    "Review the given answer and carefully analyze the image. Identify and describe the key visual elements and concepts in the image that directly support your reasoning and answer. For each point, clearly explain how that visual element contributes to the answer, and ensure every point is directly linked to the reasoning behind the answer."
    "Present your rationale in a structured, bullet-point format with the following guidelines:"
    "- Each bullet point must begin with the * character."
    "- Each point should clearly explain the connection between a specific visual element and the given answer."
    "- Avoid general descriptions of the image; focus on visual details that are relevant to the answer."
    "- Keep each point concise and ensure it directly addresses the reasoning behind the answer."
  minigpt4: |
    "Review the given answer by carefully analyzing the image. Identify and describe specific visual elements and concepts that directly support the reasoning behind the answer. Provide your rationale in a structured, bullet-point format by following these rules:"
    "- Begin each bullet point with the * character."
    "- Clearly explain how each visual element directly supports the given answer."
    "- Avoid general or unrelated descriptions of the image; focus only on details relevant to the reasoning."
    "- Be concise, ensuring each point is clear and directly tied to the answer's justification."

# These prompts concern obtaining structured information given a model's answer and rationales for it.
# These were also tweaked on a per-model basis.
out_format_template:
  internvl2: |
    "Carefully analyze each point in the list above and extract distinct pairs of entities and their relationships. For each point, identify exactly two distinct entities at a time, along with a detailed and context-specific relationship between them (e.g., action, spatial position, interaction, causality, part-whole relationship, etc.). For each extraction, you must use the following format exactly: (Entity: [entity_1], Relationship: [relationship], Entity: [entity_2])."
    "Additional guidelines:"
    "- Both entities must always be present: Ensure that each extraction contains two distinct entities in the format provided."
    "- Do not include references to the image itself (e.g., 'image,' 'picture,' 'photo') as an entity."
    "- Avoid overly simplistic relationships (e.g., 'located in' or 'visible in'). Focus on specific interactions or connections, such as 'forms,' 'comprises,' 'is part of,' 'affects,' or 'is near.'"
    "- Focus on distinct entity pairs, avoiding duplicates across all points."
    "- If a point contains multiple entities or relationships, break them down into separate pairs."
    "- Entities can refer to physical objects, people, animals, abstract concepts, etc."
    "- Relationships should reflect more complex interactions or spatial/temporal arrangements."
    "- Ensure the relationship clearly reflects how the entities are connected in context. Consider relationships like causality, containment, or part-whole structure."
    "- Prioritize clarity and contextual relevance in your extractions."
    "- Each extraction must contain two distinct entities; avoid incomplete extractions with only one entity."
    "Example:"
    "- Original sentence: 'A dog is playing with a ball near the tree.'"
    "- Output:"
    "  - (Entity: dog, Relationship: playing with, Entity: ball)"
    "  - (Entity: dog, Relationship: near, Entity: tree)"
    "  - (Entity: tree, Relationship: part of, Entity: landscape)"
