version: 1
formatters:
  simple:
    format: '[%(asctime)s] %(levelname)s in %(module)s: %(message)s'

handlers:
  info_file_handler:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: simple
    filename: ./logs/crwd_log.log
    maxBytes: 10485760
    backupCount: 20
    encoding: utf8

loggers:
  my_module:
    level: INFO
    handlers: [info_file_handler]
    propagate: no

root:
  level: INFO
  handlers: [info_file_handler]
